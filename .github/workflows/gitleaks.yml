name: gitleaks

# Secret/token leak backstop for this PUBLIC fork. Catches bearer/access tokens
# and JWTs before they land. PII discipline (no account email / userId / Pod
# serial in committed fixtures; never commit live-curl output) is enforced by
# convention + review; this job is the automated secret gate.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
